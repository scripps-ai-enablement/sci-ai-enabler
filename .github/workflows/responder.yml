name: Responder

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: responder-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo-level kill switch
        id: killswitch
        env:
          DISABLED: ${{ vars.RESPONDER_DISABLED }}
        run: |
          if [ -n "${DISABLED}" ]; then
            echo "RESPONDER_DISABLED is set; exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Form check (label must be present)
        if: steps.killswitch.outputs.skip != 'true'
        id: formcheck
        env:
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          MATCH=$(echo "$LABELS" | jq -r '.[].name' | grep -E '^claude:(recipe-question|recipe-feedback|tool-feedback|composition-report|tool-request)$' | head -1)
          if [ -z "$MATCH" ]; then
            echo "No claude:* form label on this issue; exiting silently."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "label=$MATCH" >> "$GITHUB_OUTPUT"

      - name: Spam-label check
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true'
        id: spamcheck
        env:
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          if echo "$LABELS" | jq -r '.[].name' | grep -q '^spam$'; then
            echo "Issue is labeled spam; exiting silently."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Already-answered check (idempotency for reopen)
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true'
        id: answered
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          # This workflow now also fires on `reopened` so users can retry a bounced
          # (over-length) issue by shortening it and reopening. But a reopen must NOT
          # re-answer an issue the bot already handled, or it would double-post the
          # reply and double-queue the request in curator-state.md. An "answer" is any
          # github-actions[bot] comment carrying a `<!-- queue: ... -->` trailer; the
          # over-length bounce comment has no trailer, so a bounced issue is correctly
          # treated as not-yet-answered and is allowed to proceed.
          PRIOR=$(gh api "repos/${REPO}/issues/${NUM}/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!--\\s*queue:"))] | length')
          echo "prior answered comments: ${PRIOR:-0}"
          if [ "${PRIOR:-0}" -gt 0 ]; then
            echo "Issue already answered; exiting silently."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Body-length cap
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true' && steps.answered.outputs.skip != 'true'
        id: lencheck
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          LEN=${#BODY}
          echo "Body length: $LEN"
          if [ "$LEN" -gt 4000 ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "This issue's description is ${LEN} characters; the responder caps input at 4000. Please edit it under 4000 characters, then **reopen** this issue — reopening re-runs the responder."
            gh issue close "$NUM" --repo "$REPO"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (only if we'll actually respond)
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true' && steps.answered.outputs.skip != 'true' && steps.lencheck.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Compose prompt
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true' && steps.answered.outputs.skip != 'true' && steps.lencheck.outputs.skip != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          LABEL: ${{ steps.formcheck.outputs.label }}
        run: |
          {
            cat RESPONDER_AGENT.md
            echo ""
            echo "---"
            echo ""
            echo "## This issue"
            echo "- Number: #${ISSUE_NUM}"
            echo "- Author: @${ISSUE_AUTHOR}"
            echo "- Label: ${LABEL}"
            echo "- Title: ${ISSUE_TITLE}"
            echo ""
            echo "### Body"
            echo ""
            echo "${ISSUE_BODY}"
            echo ""
            echo "---"
            echo ""
            echo "## Available context (read with Read / Glob / Grep as needed)"
            echo ""
            echo "- \`recipes/items/\` — existing recipe pages"
            echo "- \`catalog/tools/\` — installable components"
            echo "- \`autonomous-science/systems/\` — named systems"
            echo ""
            echo "Post your reply with:"
            echo "  gh issue comment ${ISSUE_NUM} --repo ${{ github.repository }} --body-file <path>"
            echo ""
            echo "End the reply with exactly one trailer line per RESPONDER_AGENT.md."
          } > .responder-prompt.md

      - uses: anthropics/claude-code-base-action@e8132bc5e637a42c27763fc757faa37e1ee43b34
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true' && steps.answered.outputs.skip != 'true' && steps.lencheck.outputs.skip != 'true'
        with:
          prompt_file: .responder-prompt.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          timeout_minutes: "6"
          allowed_tools: "Read,Glob,Grep,Write,Bash(gh issue comment:*)"
        env:
          # Expose the token to Claude's shell so `gh issue comment` can authenticate.
          # Without this the in-thread reply silently fails and the issue is only queued.
          GH_TOKEN: ${{ github.token }}

      - name: Parse trailer and append to queue
        if: steps.killswitch.outputs.skip != 'true' && steps.formcheck.outputs.skip != 'true' && steps.spamcheck.outputs.skip != 'true' && steps.answered.outputs.skip != 'true' && steps.lencheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          LABEL: ${{ steps.formcheck.outputs.label }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          rm -f .responder-prompt.md
          # Fetch the most recent comment authored by github-actions on this issue.
          LATEST=$(gh api "repos/${REPO}/issues/${NUM}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // empty')

          # Extract the last queue trailer line.
          TRAILER=$(printf '%s\n' "$LATEST" | grep -E '^<!--\s*queue:' | tail -n 1 || true)

          # Determine target file: trailer says recipes|catalog, fallback derives from label.
          if [ -n "$TRAILER" ]; then
            case "$TRAILER" in
              *"queue: catalog"*) TARGET="catalog/curator-state.md" ;;
              *)                  TARGET="recipes/curator-state.md" ;;
            esac
            # Strip the <!-- --> wrappers for the bullet form.
            INNER=$(printf '%s' "$TRAILER" | sed -E 's/^<!--\s*//; s/\s*-->$//')
            BULLET="- [#${NUM} @${AUTHOR} $(date -u +%Y-%m-%d)] ${INNER}"
          else
            # Fallback: the bot emitted no machine-readable trailer. Rebuild a structured
            # entry from the deterministic issue-form fields so the request routes to the
            # curator's normal handler instead of being stranded as bare triage. The form
            # dropdowns (recipe/tool slug, sentiment) are a closed vocabulary, so this is
            # injection-safe; only free-text is sanitized. The curator additionally gets the
            # full issue body via the pre-fetched .request-bodies/<NN>.md file.
            case "$LABEL" in
              claude:tool-feedback|claude:tool-request) TARGET="catalog/curator-state.md" ;;
              *)                    TARGET="recipes/curator-state.md" ;;
            esac
            INNER=$(python3 - <<'PY'
          import os, re
          label  = os.environ["LABEL"]
          num    = os.environ["NUM"]
          author = os.environ["AUTHOR"]
          title  = os.environ.get("TITLE", "")
          body   = os.environ.get("BODY", "")

          SENTIMENTS = {"worked great", "worked but slow", "got stuck",
                        "found a better way", "something else"}
          PROBLEM_CLASSES = {"Literature triage", "Hypothesis generation",
                             "Experimental design", "Data analysis", "Knowledge synthesis",
                             "Manuscript prep", "Workflow automation"}
          SUBJECT_AREAS = {"Chemistry", "Immunology and Microbiology",
                           "Integrative Structural and Computational Biology",
                           "Molecular and Cellular Biology", "Neuroscience",
                           "Translational Medicine", "Drug Repurposing and Discovery",
                           "General-Purpose Utilities"}

          def parse_form(md):
              # GitHub issue forms render each answer as "### <label>\n\n<value>".
              sections, cur, buf = {}, None, []
              for line in md.splitlines():
                  m = re.match(r"^###\s+(.*\S)\s*$", line)
                  if m:
                      if cur is not None:
                          sections[cur] = "\n".join(buf).strip()
                      cur, buf = m.group(1), []
                  elif cur is not None:
                      buf.append(line)
              if cur is not None:
                  sections[cur] = "\n".join(buf).strip()
              return sections

          def val(s, k):
              v = s.get(k, "").strip()
              return "" if v == "_No response_" else v

          def sanitize(s, cap=200):
              # Collapse to one line; neutralize sequences that would break the downstream
              # bullet parsers: "[#NN" (issue-number greps) and the value-wrapping quote.
              s = re.sub(r"\s+", " ", s).strip().replace('"', "'").replace("[#", "[ #")
              return s[:cap].strip()

          s = parse_form(body)
          inner = None

          if label == "claude:recipe-question":
              q = sanitize(val(s, "What are you trying to do?"))
              if q:
                  inner = f'queue: recipes | question="{q}" | author=@{author} | issue={num}'
          elif label in ("claude:recipe-feedback", "claude:tool-feedback"):
              is_tool = label == "claude:tool-feedback"
              queue = "catalog" if is_tool else "recipes"
              slug = val(s, "Which tool?" if is_tool else "Which recipe?")
              sentiment = val(s, "How did it go?")
              if sentiment not in SENTIMENTS:
                  sentiment = ""
              if slug and slug != "Not listed" and re.fullmatch(r"[a-z0-9-]+", slug) and sentiment:
                  inner = (f'queue: {queue} | feedback-on={slug} | sentiment={sentiment} '
                           f'| author=@{author} | issue={num}')
              elif sentiment:
                  inner = f'(no trailer emitted; needs curator triage) sentiment="{sentiment}" label={label}'
          elif label == "claude:composition-report":
              # Map the verbose outcome dropdown to a short token.
              raw_outcome = val(s, "How did it turn out?").lower()
              outcome = ("worked" if raw_outcome.startswith("worked")
                         else "gap" if raw_outcome.startswith("hit a gap")
                         else "failed" if raw_outcome.startswith("failed")
                         else "")
              pclass = val(s, "Problem class")
              pclass = pclass if pclass in PROBLEM_CLASSES else ""
              if outcome:
                  parts = ["queue: recipes", "report=composition", f"outcome={outcome}"]
                  if pclass:
                      parts.append(f"problem_class={pclass}")
                  parts += [f"author=@{author}", f"issue={num}"]
                  inner = " | ".join(parts)
          elif label == "claude:tool-request":
              name = sanitize(val(s, "Tool name"), 120)
              url  = sanitize(val(s, "Homepage, repo, or docs URL"), 200)
              area = val(s, "Subject area")
              if area not in SUBJECT_AREAS:
                  area = ""
              if name:
                  parts = ["queue: catalog", "request=new-tool", f'name="{name}"']
                  if url:
                      parts.append(f'url="{url}"')
                  if area:
                      parts.append(f'subject_area="{area}"')
                  parts += [f"author=@{author}", f"issue={num}"]
                  inner = " | ".join(parts)

          if inner is None:
              inner = f'(no trailer emitted; needs curator triage) title="{sanitize(title)}" label={label}'

          print(inner)
          PY
          )
            BULLET="- [#${NUM} @${AUTHOR} $(date -u +%Y-%m-%d)] ${INNER}"
          fi

          # Append under "## User requests (open)" — replace the "_None._" placeholder if present,
          # otherwise insert the bullet immediately before "## User requests (closed this run)".
          python3 - "$TARGET" "$BULLET" <<'PY'
          import re, sys, pathlib
          path = pathlib.Path(sys.argv[1])
          bullet = sys.argv[2]
          text = path.read_text()
          marker_open = "## User requests (open)"
          marker_closed = "## User requests (closed this run)"
          if marker_open not in text or marker_closed not in text:
              sys.stderr.write(f"ERROR: required sections missing in {path}\n")
              sys.exit(1)
          # Slice out the (open) block.
          start = text.index(marker_open)
          end = text.index(marker_closed)
          block = text[start:end]
          # Drop a leading "_None._" placeholder if present.
          new_block = re.sub(r"_None\._\s*\n", "", block, count=1)
          # Ensure block ends with a blank line, then append the bullet + blank.
          if not new_block.endswith("\n"):
              new_block += "\n"
          new_block = new_block.rstrip() + "\n\n" + bullet + "\n\n"
          path.write_text(text[:start] + new_block + text[end:])
          print(f"appended to {path}")
          PY

          git config user.name "responder-bot[bot]"
          git config user.email "responder-bot@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "auto-queue: issue #${NUM}"
          git pull --rebase origin main
          git push
