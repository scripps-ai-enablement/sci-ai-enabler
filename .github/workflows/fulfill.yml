name: Fulfill request

# Immediate fulfillment of a single user request.
#
# Request volume is low, so making a user wait for the weekend curator cron is a
# bad trade: the request sits in `## User requests (open)` for up to six days
# while the thread looks abandoned. `responder.yml` now dispatches this workflow
# the moment it has queued a request, so the durable change (a new recipe page,
# a tool page, an evidence-label bump) usually lands within the hour, and the
# agent narrates its progress in the user's own thread while it works.
#
# This is a *scoped re-run of the same curator agent*, not a second curator: the
# prompt is `RECIPE_AGENT.md` / `AGENT.md` verbatim plus a run section that
# reduces scope to one queue entry. Every evidence rule, the simplicity ladder,
# and the page schemas therefore apply identically to an immediate run and a
# scheduled one. The weekend cron remains the safety net — anything this run
# leaves in `## User requests (open)` or `(blocked)` is retried there.
#
# ## Outcomes, and the cross-queue chain
#
# The agent ends its result note with an `outcome=` token, and `scripts/
# request_state.py` classifies the entry afterwards. Four routes:
#
#   shipped / already-covered / declined  terminal — comment + close the issue.
#   blocked                               the request is understood and answerable,
#                                         but a load-bearing component is not in
#                                         `catalog/tools/`. Keep the issue OPEN.
#
# `blocked` used to be impossible to express: the agent moved the entry to
# `(closed this run)` and the loop-closer closed the issue as `completed`. Issue
# #74 was closed 2m24s after filing with nothing shipped — fast *and* wrong, which
# reads worse than the old weekly delay. Now a blocked recipe request chains: this
# workflow appends a derived `request=unblock-recipe` entry to the catalog queue,
# dispatches a catalog run on the missing components, and — if they get catalogued
# — hands the request back and re-runs the recipes curator, which then writes the
# recipe. The user watches all of it happen in their own thread.
#
# The chain is capped at one catalog detour (`chain=` on the entry). A second block
# terminates: the issue stays open and labelled `claude:blocked-on-catalog`, and
# the scheduled pass re-examines `(blocked)` entries each run, so a component
# catalogued later by any route still unblocks the request.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to fulfill now'
        required: true
        type: string
      queue:
        description: 'Which curator handles it (must match where the request was queued)'
        required: true
        default: recipes
        type: choice
        options:
          - recipes
          - catalog

permissions:
  contents: write
  issues: write
  # Needed to dispatch the next hop of the chain.
  actions: write

# Deliberately share the *scheduled* curators' concurrency groups (`recipes` /
# `curate`) rather than using a per-issue group. Groups are repo-wide, so this
# guarantees an immediate run and a weekend pass never edit `recipes/` or
# `catalog/` — above all `curator-state.md` — concurrently, which would collide
# on the rebase-and-push. The cost is that a second request arriving while one is
# already queued behind a running pass supersedes the first pending run; that
# request simply stays in `## User requests (open)` and the weekend pass picks it
# up, i.e. it degrades to the old behaviour instead of being lost.
concurrency:
  group: ${{ github.event.inputs.queue == 'catalog' && 'curate' || 'recipes' }}
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo-level kill switch
        id: killswitch
        env:
          DISABLED: ${{ vars.FULFILL_DISABLED }}
        run: |
          # Setting the FULFILL_DISABLED repo variable reverts to weekly-only
          # fulfillment: requests keep queueing, nothing runs on demand.
          if [ -n "${DISABLED}" ]; then
            echo "FULFILL_DISABLED is set; exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.killswitch.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Resolve the queued request
        id: resolve
        if: steps.killswitch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAW_NUM: ${{ github.event.inputs.issue }}
          QUEUE: ${{ github.event.inputs.queue }}
        run: |
          set -euo pipefail

          # Digits only — the input reaches `gh` and a state-file grep.
          NUM=$(printf '%s' "$RAW_NUM" | tr -cd '0-9')
          if [ -z "$NUM" ]; then
            echo "::error::issue input '${RAW_NUM}' is not a number."
            exit 1
          fi
          echo "num=${NUM}" >> "$GITHUB_OUTPUT"

          case "$QUEUE" in
            catalog) STATE="catalog/curator-state.md"; SPEC="AGENT.md";        CHANGELOG="CHANGELOG.md" ;;
            recipes) STATE="recipes/curator-state.md"; SPEC="RECIPE_AGENT.md"; CHANGELOG="RECIPES_CHANGELOG.md" ;;
            *) echo "::error::unknown queue '${QUEUE}'."; exit 1 ;;
          esac
          {
            echo "state=${STATE}"
            echo "spec=${SPEC}"
            echo "changelog=${CHANGELOG}"
          } >> "$GITHUB_OUTPUT"

          # The request must be queued and in the `(open)` state. If it isn't, the
          # responder hasn't pushed yet, the issue was skipped, or it is parked in
          # `(blocked)` waiting on a component — in none of those cases is there
          # work to do, and inventing some would double-answer the thread.
          CLS=$(python3 scripts/request_state.py classify --state "$STATE" --issue "$NUM")
          STATUS=$(printf '%s' "$CLS" | jq -r '.status')
          echo "classify: ${CLS}"
          if [ "$STATUS" != "open" ]; then
            echo "#${NUM} is '${STATUS}' in ${STATE}, not 'open'; nothing to fulfill."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENTRY=$(printf '%s' "$CLS" | jq -r '.line')
          echo "chain=$(printf '%s' "$CLS" | jq -r '.chain')" >> "$GITHUB_OUTPUT"

          # Keep the entry in a file rather than a step output: it carries
          # user-authored free text, and a file never reaches a shell as code.
          printf '%s\n' "$ENTRY" > .fulfill-entry.txt

          STATE_JSON=$(gh issue view "$NUM" --repo "$REPO" --json state,author --jq '.state + " " + .author.login')
          ISSUE_STATE=${STATE_JSON%% *}
          echo "author=${STATE_JSON##* }" >> "$GITHUB_OUTPUT"
          if [ "$ISSUE_STATE" != "OPEN" ]; then
            echo "Issue #${NUM} is ${ISSUE_STATE}; not fulfilling."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce the start in-thread
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.resolve.outputs.num }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A visible "in progress" label plus a timestamped comment, so the
          # thread shows work starting rather than going quiet after the reply.
          gh label create "claude:working" \
            --repo "$REPO" \
            --color "1D76DB" \
            --description "A curator run is actively working this request" \
            --force || true
          gh issue edit "$NUM" --repo "$REPO" --add-label "claude:working" || true

          gh issue comment "$NUM" --repo "$REPO" --body \
          "**Working on this now** — a curator run started at $(date -u +'%Y-%m-%d %H:%M UTC') and is reading the catalog and the literature for your request. I'll post what I find in this thread as I go, then a link to the published page when it ships. ([run log](${RUN_URL}))"

      - name: Install uv (for uvx)
        # Only the recipes path uses the `papers` MCP server (matching recipes.yml
        # vs. curate.yml), so don't pay for the install on a catalog request.
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true' && github.event.inputs.queue == 'recipes'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Compose MCP config
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          QUEUE: ${{ github.event.inputs.queue }}
        run: |
          # Claude Code connects to every configured server regardless of
          # allowed_tools, so a catalog run gets an empty server map rather than a
          # papers server it is not permitted to call.
          if [ "$QUEUE" = "recipes" ]; then
            cat > .mcp-config.json <<'JSON'
          {
            "mcpServers": {
              "papers": {
                "command": "/home/runner/.local/bin/uvx",
                "args": ["--from", "paper-search-mcp", "python", "-m", "paper_search_mcp.server"]
              }
            }
          }
          JSON
          else
            echo '{ "mcpServers": {} }' > .mcp-config.json
          fi

      - name: Pre-fetch the issue body
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.resolve.outputs.num }}
        run: |
          # Same contract as the scheduled runs: the agent Reads
          # `.request-bodies/<NN>.md` for the full request. Gitignored.
          mkdir -p .request-bodies
          gh issue view "$NUM" --repo "$REPO" \
            --json number,title,author,labels,body \
            --template '# Issue #{{.number}} — {{.title}}
          Author: @{{.author.login}}
          Labels: {{range .labels}}{{.name}} {{end}}

          {{.body}}
          ' > ".request-bodies/${NUM}.md"

      - name: Compose run prompt
        id: prompt
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          NUM: ${{ steps.resolve.outputs.num }}
          AUTHOR: ${{ steps.resolve.outputs.author }}
          QUEUE: ${{ github.event.inputs.queue }}
          STATE: ${{ steps.resolve.outputs.state }}
          SPEC: ${{ steps.resolve.outputs.spec }}
          CHANGELOG: ${{ steps.resolve.outputs.changelog }}
        run: |
          set -euo pipefail

          if [ "$QUEUE" = "recipes" ]; then
            PAGE_DIR="recipes/items/"
            TOOLS="Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(gh issue comment:*),mcp__papers__search_pubmed,mcp__papers__search_biorxiv,mcp__papers__search_medrxiv,mcp__papers__search_arxiv,mcp__papers__read_pubmed_paper,mcp__papers__read_biorxiv_paper,mcp__papers__read_medrxiv_paper,mcp__papers__read_arxiv_paper"
          else
            PAGE_DIR="catalog/tools/"
            TOOLS="Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(gh issue comment:*)"
          fi
          echo "tools=${TOOLS}" >> "$GITHUB_OUTPUT"

          {
            cat "${SPEC}"
            echo ""
            echo "---"
            echo ""
            echo "## This run — immediate fulfillment of one user request"
            echo ""
            echo "- UTC now: $(date -u +'%Y-%m-%d %H:%M')"
            echo "- Trigger: @${AUTHOR} filed issue #${NUM} minutes ago. This is **not** a scheduled pass."
            echo "- Queue file: \`${STATE}\`"
            echo "- Full request body: \`.request-bodies/${NUM}.md\` — Read it first."
            echo "- The queued entry:"
            echo ""
            echo '```'
            cat .fulfill-entry.txt
            echo '```'
            echo ""
            echo "### Scope — narrower than a scheduled run"
            echo ""
            echo "Do exactly one thing: process the \`[#${NUM} …]\` entry in \`## User requests (open)\`,"
            echo "following the **User requests** procedure in the spec above. Everything else in that spec"
            echo "about directed passes, focus areas/categories, manifest sweeps, verification of aging"
            echo "pages, and the per-run soft caps is **suspended for this run**."
            echo ""
            echo "- Do not touch any other \`## User requests (open)\` entry — those belong to the scheduled pass."
            echo "- At most **one** new page (\`${PAGE_DIR}<slug>.md\`). Editing existing pages as the request"
            echo "  requires is fine. Do not opportunistically improve unrelated pages."
            echo "- The evidence rules, the simplicity ladder, and the page schema are **not** relaxed by"
            echo "  the deadline. A correct \`Proposed\` recipe beats a rushed overclaim, and \"the honest"
            echo "  answer is that no catalogued component does this yet\" is a legitimate outcome — record"
            echo "  it under \`## Missing components\` (recipes) or \`## Deferred — next-run priority\` (catalog)."
            echo "- Add a \`${CHANGELOG}\` entry under a \`## $(date -u +%Y-%m-%d) (user request #${NUM})\` heading."
            echo ""
            echo "### Outcome — pick exactly one, and end your result note with the token"
            echo ""
            echo "Move the #${NUM} entry out of \`## User requests (open)\` and append a \`→ <result>\` note"
            echo "ending in an \`outcome=\` token. The workflow reads that token to decide what to tell the"
            echo "user and whether to close the thread, so it has to be honest."
            echo ""
            echo "| Token | When | Move it to | What the workflow does |"
            echo "|---|---|---|---|"
            echo "| \`outcome=shipped\` | a page shipped, or an existing page was updated | \`(closed this run)\` | comments the commit + page link, closes the issue |"
            echo "| \`outcome=already-covered\` | the cookbook/catalog already answers it | \`(closed this run)\` | same, linking the existing page |"
            echo "| \`outcome=declined\` | genuinely out of scope, unverifiable, or license-blocked | \`(closed this run)\` | closes with your reason — so state it plainly |"
            echo "| \`outcome=blocked\` | you understand the request and it *is* answerable, but a load-bearing component is not in \`catalog/tools/\` | **\`## User requests (blocked)\`** | keeps the issue **open**, and immediately dispatches a catalog run on the components you name |"
            echo ""
            echo "Name the page path (e.g. \`${PAGE_DIR}<slug>.md\`) in the note whenever one shipped — the"
            echo "workflow turns it into a rendered link for the user."
            echo ""
            echo "**On \`outcome=blocked\`:** move the entry to \`## User requests (blocked)\` — *not*"
            echo "\`(closed this run)\` — and add a \`blocked-on=catalog:<slug>,<slug>\` field naming the"
            echo "components, lowercase, comma-separated, no spaces. Also file the usual"
            echo "\`## Missing components\` note with the URL, install path, and what each component does:"
            echo "that note *is* the brief the catalog curator reads on the next hop, so make it complete"
            echo "enough to act on. Flag any license you could not verify."
            echo ""
            echo "\`blocked\` is not a failure and not a soft \`declined\` — it is the state that triggers the"
            echo "chain that actually unblocks the user. Never write \`outcome=shipped\` when nothing shipped."
            echo ""
            echo "- If you cannot action the request at all (not blocked — you simply ran out of time), leave"
            echo "  it in \`## User requests (open)\`, say why in a progress comment, and stop. The scheduled"
            echo "  pass will retry it; nothing is lost."
            echo ""
            echo "### Keep the user posted — this is the point of immediate mode"
            echo ""
            echo "@${AUTHOR} is watching the thread right now. Unlike the scheduled curators, you have a"
            echo "shell here, limited to \`gh issue comment\`. Use it:"
            echo ""
            echo "1. Write the comment body with the \`Write\` tool to \`/tmp/progress-1.md\`."
            echo "2. Run: \`gh issue comment ${NUM} --repo ${REPO} --body-file /tmp/progress-1.md\`"
            echo ""
            echo "Post **one** progress comment as soon as you know your plan — early, not at the end."
            echo "Post **at most one more** only if the work genuinely turns (the request needs a component"
            echo "that isn't catalogued; a paper changes the approach; the recipe has to move up a rung)."
            echo "Two comments maximum. Never post a contentless \"still working\" note."
            echo ""
            echo "A good progress comment is 2–4 sentences of specifics: what you searched, what you found"
            echo "or ruled out, and what you are about to write. \"No existing recipe covers CCF subregion"
            echo "lookup; the nearest is <x>. brainglobe-atlasapi is catalogued and does the tip-coordinate"
            echo "lookup, so I'm writing a rung-2 recipe around it\" is worth posting. \"Working on it\" is not."
            echo ""
            echo "Do **not** post a final \"shipped\" comment and do **not** close the issue — the workflow"
            echo "does both after you exit, with the commit SHA and the rendered page URL."
            echo ""
            # A chained detour: the recipes curator blocked on components this run
            # has to evaluate. It needs a different brief from a direct request.
            if grep -q 'request=unblock-recipe' .fulfill-entry.txt; then
              echo "### This is a chained request — a recipe is blocked on you"
              echo ""
              echo "The recipes curator could not answer issue #${NUM} because the components named in"
              echo "the entry above are not in \`catalog/tools/\`. It filed the details — URL, install path,"
              echo "what each component does, and any license concern — under \`## Missing components\` in"
              echo "\`recipes/curator-state.md\`. **Read that note first: it is the request.**"
              echo "\`.request-bodies/${NUM}.md\` has the user's original question for context."
              echo ""
              echo "Evaluate each component against the **normal surfacing bar** — real, installable,"
              echo "license-clear, in scope. Do not lower it because a recipe is waiting: cataloguing a tool"
              echo "you could not verify would put an unverified install path in front of a user, which is"
              echo "worse than making them wait."
              echo ""
              echo "- The one-new-page cap does **not** apply to this run. Catalogue every component that"
              echo "  clears the bar — a partial set leaves the recipe blocked and wastes the whole chain."
              echo "- Every component clears → \`outcome=shipped\`. The workflow hands the request back to the"
              echo "  recipes curator automatically and the recipe gets written on the next hop."
              echo "- Some clear, some don't → still \`outcome=shipped\`; name which didn't and why. The"
              echo "  recipes curator decides whether the recipe is possible with what landed."
              echo "- None clear (out of scope, no license, unverifiable) → \`outcome=declined\` with the"
              echo "  reason. The workflow tells the user plainly instead of looping."
              echo ""
              echo "Your progress comment goes on issue #${NUM} — the user's own thread. Write it for them,"
              echo "not for the recipes curator: say which components you're evaluating and what you found."
              echo ""
            fi
            echo "### Wall-clock"
            echo ""
            echo "You have 20 minutes. Budget it: read the request, search, decide, write one good page,"
            echo "update the state file and changelog. Depth on one request, not breadth."
          } > .run-prompt.md

      - uses: anthropics/claude-code-base-action@e8132bc5e637a42c27763fc757faa37e1ee43b34
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          # See the long note in recipes.yml: the pinned action bundles Claude Code
          # 1.0.88, which reads the OLD var name for WebFetch's summarizer model.
          # Both names are set so the pin can move later. Do NOT bump to a CC 2.x
          # pin — it sends the context_management API feature, which this org's
          # HIPAA/ZDR key rejects with a 400.
          ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4-5-20251001
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
          # Lets the agent authenticate `gh issue comment` for progress notes.
          GH_TOKEN: ${{ github.token }}
        with:
          prompt_file: .run-prompt.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-5
          # Narrower than it looks — do not rely on it. Observed 2026-07-29: a
          # first-turn `529 overloaded_error` on claude-opus-5 killed the run with
          # exit 1 while this was set, so it does NOT rescue a capacity event at the
          # start of a run. It also cannot cover an unrecognized model string. Kept
          # only because it costs nothing and may still catch a mid-run failure.
          fallback_model: claude-opus-4-8
          mcp_config: .mcp-config.json
          timeout_minutes: "20"
          allowed_tools: ${{ steps.prompt.outputs.tools }}

      - name: Commit, push, and notify
        id: commit
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          NUM: ${{ steps.resolve.outputs.num }}
          QUEUE: ${{ github.event.inputs.queue }}
          CHANGELOG: ${{ steps.resolve.outputs.changelog }}
        run: |
          rm -f .run-prompt.md .mcp-config.json .fulfill-entry.txt
          rm -rf .request-bodies

          if [ "$QUEUE" = "catalog" ]; then
            BOT="catalog-curator"; TRACKER="Catalog updates"
          else
            BOT="recipes-curator"; TRACKER="Recipes updates"
          fi
          git config user.name "${BOT}[bot]"
          git config user.email "${BOT}@users.noreply.github.com"

          # Splice in the agent's dated changelog block and rotate older blocks to
          # the matching *_ARCHIVE.md. The agent writes `.changelog-block.md`
          # instead of editing a 100 KB+ file, which keeps the changelog out of its
          # context. If the block file is absent (the agent edited ${CHANGELOG}
          # directly, the older instruction), this still rotates and is otherwise a
          # no-op. Runs before the git-status gate so a changelog-only run counts
          # as a change.
          python3 scripts/prepend_changelog.py --file "${CHANGELOG}" \
            --block .changelog-block.md --keep 12
          rm -f .changelog-block.md

          if [ -z "$(git status --porcelain)" ]; then
            # The agent produced nothing durable. Say so plainly instead of
            # letting the thread trail off after "working on this now".
            echo "No changes this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUM" --repo "$REPO" --body \
            "This run didn't get your request to a durable change. It's still queued, and the next scheduled curator pass will pick it up with more wall-clock. If you can add detail to the issue — the exact data you have, the tool you'd expect to use, the output you need — that materially improves the next attempt."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git add -A
          git commit -m "Fulfill request #${NUM}"
          # Rebase onto anything that landed during the run (index rebuilds,
          # another curator, the responder's own auto-queue commit).
          git pull --rebase origin main
          git push
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          # Keep the rolling tracking issue complete: it claims every run that
          # produced changes posts here, and an immediate run is still a run.
          ISSUE=$(gh issue list \
            --state open \
            --search "in:title \"${TRACKER}\"" \
            --json number,title \
            --jq "[.[] | select(.title == \"${TRACKER}\")][0].number")
          if [ -n "${ISSUE}" ] && [ "${ISSUE}" != "null" ]; then
            LATEST=$(awk '/^## / {n++} n>=2 {exit} n==1 {print}' "${CHANGELOG}")
            {
              echo "${LATEST}"
              echo ""
              echo "On-demand run for user request #${NUM}. [View commit](${SERVER_URL}/${REPO}/commit/${SHA})"
            } | gh issue comment "${ISSUE}" --body-file -
          fi

      - name: Route the outcome
        if: steps.killswitch.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          NUM: ${{ steps.resolve.outputs.num }}
          AUTHOR: ${{ steps.resolve.outputs.author }}
          QUEUE: ${{ github.event.inputs.queue }}
          STATE: ${{ steps.resolve.outputs.state }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          COMMIT_URL="${SERVER_URL}/${REPO}/commit/${SHA}"
          PAGES_BASE="https://scripps-ai-enablement.github.io/sci-ai-enabler"
          RS="python3 scripts/request_state.py"
          # The *other* queue's state file — the chain writes across the pair.
          if [ "$QUEUE" = "catalog" ]; then
            OTHER_STATE="recipes/curator-state.md"; OTHER_QUEUE="recipes"
          else
            OTHER_STATE="catalog/curator-state.md"; OTHER_QUEUE="catalog"
          fi

          # Apply one idempotent request_state.py mutation and push it, re-applying
          # from a clean origin/main if we lose a push race. Idempotence is what
          # makes the retry safe: re-running the same mutation on the rebased tree
          # either does nothing or does exactly what it did before.
          apply_and_push() {
            MSG="$1"; shift
            for attempt in 1 2 3; do
              if [ "$attempt" -gt 1 ]; then
                echo "push race; re-applying on a fresh origin/main (attempt ${attempt})"
                git fetch -q origin main && git reset -q --hard origin/main
              fi
              $RS "$@" || return 1
              if git diff --quiet; then
                echo "nothing to commit for: ${MSG}"
                return 0
              fi
              git add -A && git commit -q -m "$MSG"
              if git push -q; then return 0; fi
            done
            echo "::warning::could not push '${MSG}' after 3 attempts."
            return 1
          }

          # Post to the user's thread. Never fatal: the queue state is already
          # committed by the time these run, so aborting the router on a transient
          # comment failure would strand the chain instead of just losing a comment.
          say() {
            gh issue comment "$NUM" --repo "$REPO" --body "$1" \
              || echo "::warning::could not comment on #${NUM}"
          }

          unpark() {  # the request is no longer waiting on anything
            gh issue edit "$NUM" --repo "$REPO" \
              --remove-label "claude:blocked-on-catalog" >/dev/null 2>&1 || true
          }

          dispatch() {  # dispatch <issue> <queue>
            echo "dispatching next hop: issue=$1 queue=$2"
            gh workflow run fulfill.yml --repo "$REPO" -f "issue=$1" -f "queue=$2" \
              || echo "::warning::could not dispatch fulfill.yml for #$1 ($2); the scheduled pass will retry."
          }

          CLS=$($RS classify --state "$STATE" --issue "$NUM")
          echo "classify: ${CLS}"
          # `//` defaults on every field: classify() guarantees a complete record,
          # but this step runs under `set -u` and a null would abort the router.
          STATUS=$(printf '%s' "$CLS" | jq -r '.status // "absent"')
          # `result_prose` is the note with the machine `outcome=` token stripped —
          # every user-facing comment uses it, so the token never leaks into prose.
          RESULT=$(printf '%s' "$CLS" | jq -r '.result_prose // .result // ""')
          OUTCOME=$(printf '%s' "$CLS" | jq -r '.outcome // ""')
          VIA=$(printf '%s' "$CLS" | jq -r '.via // ""')
          CHAIN=$(printf '%s' "$CLS" | jq -r '.chain // 0')
          BLOCKED_ON=$(printf '%s' "$CLS" | jq -r '(.blocked_on // []) | join(",")')

          # ------------------------------------------------------------------ #
          case "$STATUS" in

          blocked)
            # Understood but unanswerable. The issue stays OPEN — closing here is
            # exactly the #74 mistake. Normalize the entry into `(blocked)` in case
            # the agent wrote `outcome=blocked` while leaving it elsewhere.
            apply_and_push "blocked: request #${NUM}" \
              move --state "$STATE" --issue "$NUM" --to blocked || true
            gh label create "claude:blocked-on-catalog" --repo "$REPO" --color "D93F0B" \
              --description "Answerable, but waiting on a component to be catalogued" --force || true
            gh issue edit "$NUM" --repo "$REPO" --add-label "claude:blocked-on-catalog" || true

            if [ "$QUEUE" = "recipes" ] && [ -n "$BLOCKED_ON" ] && [ "$CHAIN" -lt 1 ]; then
              # Chain hop 1: ask the catalog curator for the missing components now.
              SLUGS=$(printf '%s' "$BLOCKED_ON" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9,._-')
              PRETTY=$(printf '%s' "$SLUGS" | tr ',' ' ' | tr -s ' ')
              LINE="- [#${NUM} @${AUTHOR} $(date -u +%Y-%m-%d)] queue: catalog | request=unblock-recipe | components=\"${SLUGS}\" | author=@${AUTHOR} | issue=${NUM} | via=recipes-block | chain=1"
              if apply_and_push "chain: catalog hop for request #${NUM}" \
                   append --state "$OTHER_STATE" --section open --line "$LINE"; then
                say \
                "**Not done yet — and not closing this.** ${RESULT}"$'\n\n'"I've handed the missing pieces straight to the catalog curator, which is evaluating **${PRETTY}** right now against the usual bar (real, installable, license-clear, in scope). If they clear it, this request comes back to the recipe assembler automatically and I'll write the recipe in this same thread — no action needed from you. If they don't clear it, I'll tell you exactly why."$'\n\n'"Progress so far: ${COMMIT_URL}"
                dispatch "$NUM" catalog
              else
                say \
                "${RESULT}"$'\n\n'"I couldn't queue the catalog follow-up automatically ([run log](${RUN_URL})). Leaving this open and labelled — the next scheduled catalog pass will evaluate **${PRETTY}**, and the recipe gets written once they land."
              fi
            elif [ -n "$BLOCKED_ON" ]; then
              # Budget spent (a second block) — stop rather than ping-pong.
              PRETTY=$(printf '%s' "$BLOCKED_ON" | tr ',' ' ' | tr -s ' ')
              say \
              "**Still blocked, and I've stopped auto-chaining on this one.** ${RESULT}"$'\n\n'"This request already took one automated trip through the catalog curator, so rather than bounce it again I'm leaving it open and labelled \`claude:blocked-on-catalog\`. It needs **${PRETTY}**. Every scheduled curator pass re-checks blocked requests, so the moment those are catalogued — by any route — the recipe gets written and you'll get a comment here."$'\n\n'"Progress so far: ${COMMIT_URL}"
            else
              say \
              "**Not done yet — and not closing this.** ${RESULT}"$'\n\n'"Leaving it open and labelled \`claude:blocked-on-catalog\`. Every scheduled curator pass re-checks blocked requests, so this gets picked up again automatically once the blocker clears."$'\n\n'"Progress so far: ${COMMIT_URL}"
            fi
            ;;

          "closed this run")
            if [ "$VIA" = "recipes-block" ]; then
              # This run WAS the catalog detour. Never close here — the user asked
              # for a recipe, not a tool page.
              apply_and_push "chain: catalog hop done for request #${NUM}" \
                prune --state "$STATE" --issue "$NUM" --section "closed this run" || true

              case "$OUTCOME" in
              shipped|already-covered)
                say \
                "**Components are in the catalog now.** ${RESULT}"$'\n\n'"Handing this straight back to the recipe assembler — it's starting on your recipe now, in this thread. ${COMMIT_URL}"
                # Hand back: `(blocked)` -> `(open)` with the chain spent, and a
                # fresh note (a stale `outcome=blocked` would re-block it forever).
                if apply_and_push "chain: hand #${NUM} back to recipes" \
                     move --state "$OTHER_STATE" --issue "$NUM" --to open --chain 1 \
                     --note "components catalogued via the catalog hop (${COMMIT_URL}); write the recipe now"; then
                  dispatch "$NUM" recipes
                else
                  say \
                  "I couldn't re-queue the recipe step automatically ([run log](${RUN_URL})). The components are catalogued, so the next scheduled recipes pass will write it."
                fi
                ;;
              *)
                # The blocker itself was declined. Handing back would just re-block.
                # Spend the chain budget on the parked recipes entry so a later
                # re-block can't send the same components back to a catalog curator
                # that has already said no.
                apply_and_push "chain: budget spent for request #${NUM}" \
                  move --state "$OTHER_STATE" --issue "$NUM" --to blocked --chain 1 || true
                say \
                "**I can't get you this one, and here's the honest reason.** ${RESULT}"$'\n\n'"Because those components can't go in the catalog, the recipe can't be written against them — the cookbook's rule is that a recipe only assembles components that are catalogued and verified, so writing it anyway would hand you an install path nobody checked. I'm leaving this open and labelled \`claude:blocked-on-catalog\` rather than closing it: if the licensing or packaging situation changes, or if you know a catalogued alternative, say so here and it gets picked straight back up."$'\n\n'"${COMMIT_URL}"
                ;;
              esac
            elif [ "$OUTCOME" = "declined" ]; then
              # Terminal, but not a success — don't dress it up as one.
              say \
              "**Not doing this one — here's why.** ${RESULT}"$'\n\n'"Recorded in ${COMMIT_URL} so the reasoning isn't lost. Closing, but reopen with more detail if you think this was the wrong call."
              unpark
              gh issue close "$NUM" --repo "$REPO" --reason completed || true
              apply_and_push "loop-closed: request #${NUM}" \
                prune --state "$STATE" --issue "$NUM" --section "closed this run" || true
            else
              # Shipped / already-covered — the happy path.
              PAGE_PATH=$(printf '%s' "$RESULT" | grep -oE '(recipes/items|catalog/tools)/[a-z0-9-]+\.md' | head -1)
              LINK_LINE=""
              if [ -n "$PAGE_PATH" ]; then
                LINK_LINE=$'\n\nRead the answer here: '"${PAGES_BASE}/${PAGE_PATH%.md}.html"$'\n\n(The site rebuilds within a couple of minutes of the commit — if the link 404s, give it a moment.)'
              fi
              say \
              "Shipped in ${COMMIT_URL}. ${RESULT}${LINK_LINE}"$'\n\nClosing — reopen if this missed the mark, or file a feedback issue once you\'ve tried it.'
              unpark
              gh issue close "$NUM" --repo "$REPO" --reason completed || true
              apply_and_push "loop-closed: request #${NUM}" \
                prune --state "$STATE" --issue "$NUM" --section "closed this run" || true
            fi
            ;;

          open)
            # Ran out of wall-clock without reaching a verdict.
            say \
            "This run made progress (${COMMIT_URL}) but didn't reach a verdict on your request, so it stays queued and open. The next scheduled curator pass retries it with a full time budget. Adding detail to the issue — the exact data you have, the tool you'd expect to use, the output you need — materially improves the next attempt."
            ;;

          *)
            say \
            "Changes landed in ${COMMIT_URL}, but I lost track of your request's queue entry, so I'm leaving this open rather than guessing. A maintainer will see the \`claude:working\` history on this thread; the next scheduled pass also re-scans the queue."
            ;;
          esac

      - name: Report a failed run in-thread
        if: failure() && steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.num != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.resolve.outputs.num }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Never leave the thread hanging after "working on this now".
          gh issue comment "$NUM" --repo "$REPO" --body \
          "The on-demand run on your request hit an error and stopped ([run log](${RUN_URL})). Your request is still queued — the next scheduled curator pass will retry it, and nothing you filed was lost." || true

      - name: Clear the working label
        # `claude:working` is per-run, so it always comes off. The router removes
        # `claude:blocked-on-catalog` itself on a terminal outcome — that label is
        # a standing "parked" signal, and a shipped request that keeps it reads as
        # still-blocked (observed on #74 after the recipe shipped).
        if: always() && steps.resolve.outputs.num != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.resolve.outputs.num }}
        run: gh issue edit "$NUM" --repo "$REPO" --remove-label "claude:working" || true
