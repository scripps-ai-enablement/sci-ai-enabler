name: Verify catalog

on:
  schedule:
    # Weekday runs, offset from the weekend catalog/recipe curators so the two
    # agents don't edit catalog/tools/*.md at the same time. Mon/Wed/Fri 08:00 UTC.
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:
    inputs:
      scope:
        description: 'bootstrap (unstamped first) or maintenance (re-verify aging)'
        required: false
        default: 'maintenance'
        type: choice
        options: [bootstrap, maintenance]
      count:
        description: 'Per-run verification budget'
        required: false
        default: '25'
        type: string
      smoke_max:
        description: 'Max components the quarantined smoke job may install/boot'
        required: false
        default: '12'
        type: string

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — QUARANTINE. Executes untrusted third-party install/boot commands for
  # the SAFE subset only. No secrets, no PAT, contents: read, runs in a container
  # as a non-root user. It cannot write the repo or reach any credential; a
  # malicious package's blast radius is this ephemeral VM, which is then thrown
  # away. Its only output is the smoke-results artifact the agent job reads.
  # Residual risk: GitHub runners have open network egress (needed to install
  # from npm/PyPI). That is bounded by the absence of any secret or write here.
  # ---------------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (node for npx, uv for uvx)
        run: |
          apt-get update && apt-get install -y --no-install-recommends nodejs npm curl ca-certificates
          curl -LsSf https://astral.sh/uv/install.sh | sh || true

      - name: Create non-root user and select the safe subset
        env:
          SMOKE_MAX_IN: ${{ inputs.smoke_max }}
        run: |
          SMOKE_MAX="${SMOKE_MAX_IN:-12}"
          case "$SMOKE_MAX" in ''|*[!0-9]*) SMOKE_MAX=12 ;; esac  # digits only
          mkdir -p .verify
          python3 scripts/select_smoke_targets.py --max "${SMOKE_MAX}" --out .verify/smoke-batch.json
          useradd -m smoke || true
          chown -R smoke:smoke .verify scripts catalog

      - name: Run smoke tests as non-root (isolated, timed, no secrets)
        run: |
          # Drop to the unprivileged user; no secrets are present in this job.
          su smoke -c "python3 scripts/run_smoke_tests.py --batch .verify/smoke-batch.json --out .verify/smoke-results.json"

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: .verify/smoke-results.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 2 — the Verifier agent. Sandboxed like the other curators (NO Bash): it
  # does static checks via WebFetch and reads the smoke-results artifact. It
  # writes stamps + entry fixes, then the workflow commits to main and notifies.
  # ---------------------------------------------------------------------------
  verify:
    needs: [smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download smoke results
        uses: actions/download-artifact@v4
        with:
          name: smoke-results
          path: .verify
        continue-on-error: true

      - name: Compose run prompt
        env:
          SCOPE_IN: ${{ inputs.scope }}
          COUNT_IN: ${{ inputs.count }}
        run: |
          SCOPE="${SCOPE_IN:-maintenance}"
          case "$SCOPE" in bootstrap|maintenance) ;; *) SCOPE=maintenance ;; esac
          COUNT="${COUNT_IN:-25}"
          case "$COUNT" in ''|*[!0-9]*) COUNT=25 ;; esac
          [ -f .verify/smoke-results.json ] || echo '{"results":[]}' > .verify/smoke-results.json
          {
            cat VERIFIER_AGENT.md
            echo ""
            echo "---"
            echo ""
            echo "## This run"
            echo "- UTC date: $(date -u +%Y-%m-%d)"
            echo "- scope: ${SCOPE}"
            echo "- count budget: ${COUNT}"
            echo "- smoke results: .verify/smoke-results.json (read it for boot verdicts)"
          } > .run-prompt.md

      - uses: anthropics/claude-code-base-action@e8132bc5e637a42c27763fc757faa37e1ee43b34
        env:
          # See curate.yml for why these are pinned and why the action must NOT be
          # bumped to a CC 2.x pin (HIPAA/ZDR key rejects context_management).
          ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4-5-20251001
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
        with:
          prompt_file: .run-prompt.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          # NO Bash: static checks are WebFetch calls to GitHub/npm/PyPI/OSV.
          allowed_tools: "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"
          timeout_minutes: "25"

      - name: Commit, push, and notify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          rm -f .run-prompt.md
          rm -rf .verify
          git config user.name "verifier[bot]"
          git config user.email "verifier@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No verification changes this run."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git add -A
          git commit -m "Verification pass ${DATE}"
          git pull --rebase origin main
          git push
          SHA=$(git rev-parse HEAD)

          ISSUE=$(gh issue list --state open --search 'in:title "Verification updates"' \
            --json number,title --jq '[.[] | select(.title == "Verification updates")][0].number')
          if [ -z "${ISSUE}" ] || [ "${ISSUE}" = "null" ]; then
            ISSUE_URL=$(gh issue create --title "Verification updates" \
              --body "Rolling log of catalog verification + security passes. Each run that produced changes comments here.")
            ISSUE="${ISSUE_URL##*/}"
            gh issue pin "${ISSUE}" || true
          fi

          LATEST=$(awk '/^## / {n++} n>=2 {exit} n==1 {print}' VERIFIER_CHANGELOG.md)
          {
            echo "${LATEST}"
            echo ""
            echo "[View commit](${SERVER_URL}/${REPO}/commit/${SHA})"
          } | gh issue comment "${ISSUE}" --body-file -
