name: Curate catalog

on:
  schedule:
    # Weekend run, seven 6-hour slots so all seven focus categories are covered
    # once each weekend (one category per slot — see the derivation below).
    # Catalog leads the chain; guide/autonomous-science run once early Saturday
    # and recipes trails each catalog slot by 3 hours.
    - cron: '0 0,6,12,18 * * 6'   # Sat 00/06/12/18 UTC -> categories 1-4
    - cron: '0 0,6,12 * * 0'      # Sun 00/06/12 UTC    -> categories 5-7
  workflow_dispatch:
    inputs:
      category:
        description: 'Scope this run to one category (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chemistry
          - immunology-microbiology
          - structural-computational-biology
          - molecular-cellular-biology
          - neuroscience
          - translational-medicine
          - drug-repurposing-discovery

permissions:
  contents: write
  issues: write

concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose run prompt
        run: |
          SCOPE="${{ inputs.category }}"
          SCOPE="${SCOPE:-all}"

          # One focus category per weekend slot, so all seven are covered each
          # weekend. Derive the category from the UTC day + 6-hour bucket
          # (Sat buckets 0-3 -> 1-4, Sun buckets 0-2 -> 5-7); the bucket
          # tolerates the usual cron delay within a slot. Used by the
          # directed-pass procedure under "Topic-focused rotation" in AGENT.md.
          DOW=$(date -u +%u)                   # 6=Sat, 7=Sun
          BUCKET=$(( 10#$(date -u +%H) / 6 ))  # 0..3 within the day
          if [ "${DOW}" = "7" ]; then IDX=$(( BUCKET + 5 )); else IDX=$(( BUCKET + 1 )); fi
          if [ "${IDX}" -lt 1 ]; then IDX=1; fi
          if [ "${IDX}" -gt 7 ]; then IDX=7; fi
          case "${IDX}" in
            1) FOCUS="Chemistry" ;;
            2) FOCUS="Immunology and Microbiology" ;;
            3) FOCUS="Integrative Structural and Computational Biology" ;;
            4) FOCUS="Molecular and Cellular Biology" ;;
            5) FOCUS="Neuroscience" ;;
            6) FOCUS="Translational Medicine" ;;
            7) FOCUS="Drug Repurposing and Discovery" ;;
          esac

          # The aging-entry link/pricing recheck runs in ONE weekend slot, not all
          # seven. It is re-checking, not discovery: running it every slot meant
          # seven agents per weekend each re-fetching supplier links, overlapping
          # both each other and the Verifier's own liveness fetches. Discovery
          # (manifest sweep + directed pass) still runs in every slot.
          if [ "${IDX}" = "1" ]; then LINK_RECHECK="yes"; else LINK_RECHECK="no"; fi

          {
            cat AGENT.md
            echo ""
            echo "---"
            echo ""
            echo "## This run"
            echo "- UTC date: $(date -u +%Y-%m-%d)"
            echo "- Scope: ${SCOPE}"
            echo "- focus_category: ${FOCUS}"
            echo "- link_recheck: ${LINK_RECHECK}"
            if [ "${SCOPE}" = "all" ]; then
              echo "- Run the manifest sweep AND the directed pass for the focus category. Update any per-tool pages under \`catalog/tools/\` as warranted, plus \`CHANGELOG.md\` per your instructions."
            else
              echo "- Limit edits to tool pages whose front-matter \`tool_categories\` includes \"${SCOPE}\" (plus \`CHANGELOG.md\` per your instructions). When \`${SCOPE}\` matches \`${FOCUS}\`, run the directed pass; otherwise rely on the manifest sweep filtered to this category."
            fi
          } > .run-prompt.md

      - name: Pre-fetch user-request issue bodies
        # The curator agent runs sandboxed (no Bash/gh), but AGENT.md asks it to
        # read issue bodies for feedback and triage entries. The agent step has no
        # gh access, so fetch the bodies here (where GH_TOKEN is available) into
        # `.request-bodies/<NN>.md` for the agent to Read. Cleaned up before the
        # commit step; gitignored so a mid-run failure can't commit them.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          STATE="catalog/curator-state.md"
          mkdir -p .request-bodies
          [ -f "$STATE" ] || exit 0
          # Issue numbers (e.g. "[#12 ...]") from both `(open)` and `(blocked)` — the agent re-examines blocked requests
          # each run to see whether their missing components have since landed,
          # which it cannot do without the original issue body.
          NUMS=$(awk '
            /^## User requests \((open|blocked)\)/ { capture=1; next }
            /^## / { capture=0 }
            capture
          ' "$STATE" | grep -oE '\[#[0-9]+' | tr -d '[#' | sort -u)
          for NUM in $NUMS; do
            if gh issue view "$NUM" --repo "$REPO" \
                --json number,title,author,labels,body \
                --template '# Issue #{{.number}} — {{.title}}
          Author: @{{.author.login}}
          Labels: {{range .labels}}{{.name}} {{end}}

          {{.body}}
          ' > ".request-bodies/${NUM}.md" 2>/dev/null; then
              echo "fetched #${NUM}"
            else
              echo "could not fetch #${NUM}"
              rm -f ".request-bodies/${NUM}.md"
            fi
          done

      - uses: anthropics/claude-code-base-action@e8132bc5e637a42c27763fc757faa37e1ee43b34
        env:
          # WebFetch summarizes fetched pages with a small/fast "Haiku" model. Pin it
          # to a live model so it does not 404 on the retired claude-3-5-haiku-20241022.
          # The Claude Code bundled in the pinned action (v1.0.88) reads the OLD var
          # name ANTHROPIC_SMALL_FAST_MODEL; the newer ANTHROPIC_DEFAULT_HAIKU_MODEL is
          # ignored by that version (verified in CI) — which is why setting only the
          # latter had no effect. Both are set so the pin can later move to a CC that
          # uses the new name. Do NOT bump the action to a CC 2.x pin to "fix" this:
          # CC 2.x sends the context_management API feature, which this org's HIPAA/ZDR
          # key rejects with a 400, failing every run on turn 1.
          ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4-5-20251001
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
        with:
          prompt_file: .run-prompt.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-5
          # Narrower than it looks — do not rely on it. Observed 2026-07-29: a
          # first-turn `529 overloaded_error` on claude-opus-5 killed the run with
          # exit 1 while this was set, so it does NOT rescue a capacity event at the
          # start of a run. It also cannot cover an unrecognized model string. Kept
          # only because it costs nothing and may still catch a mid-run failure.
          fallback_model: claude-opus-4-8
          allowed_tools: "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch"
          # The action defaults to a 10-minute internal timeout, which the
          # full manifest sweep + directed pass routinely overruns. Match
          # recipes.yml at 25 min; the job-level timeout-minutes: 30 is the
          # outer ceiling and leaves headroom for the commit/push steps.
          timeout_minutes: "25"

      - name: Commit, push, and notify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          rm -f .run-prompt.md
          rm -rf .request-bodies
          git config user.name "catalog-curator[bot]"
          git config user.email "catalog-curator@users.noreply.github.com"

          # Splice in the agent's dated changelog block and rotate older blocks to
          # CHANGELOG_ARCHIVE.md. The agent writes `.changelog-block.md` instead of
          # editing a 100 KB+ file, which keeps the changelog out of its context.
          # If the block file is absent (the agent edited CHANGELOG.md directly, the
          # older instruction), this still rotates and is a no-op otherwise.
          python3 scripts/prepend_changelog.py --file CHANGELOG.md \
            --block .changelog-block.md --keep 12
          rm -f .changelog-block.md

          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes this run."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git add -A
          git commit -m "Catalog update ${DATE}"
          # Rebase onto any commits that landed during this run (e.g., the guide agent finishing first)
          git pull --rebase origin main
          git push
          SHA=$(git rev-parse HEAD)

          # Find or create the pinned tracking issue
          ISSUE=$(gh issue list \
            --state open \
            --search 'in:title "Catalog updates"' \
            --json number,title \
            --jq '[.[] | select(.title == "Catalog updates")][0].number')
          if [ -z "${ISSUE}" ] || [ "${ISSUE}" = "null" ]; then
            ISSUE_URL=$(gh issue create \
              --title "Catalog updates" \
              --body "Rolling log of catalog updates. Each scheduled or on-demand run that produced changes posts a comment here.")
            ISSUE="${ISSUE_URL##*/}"
            gh issue pin "${ISSUE}" || true
          fi

          # Extract the top changelog entry (everything from the first '## ' up to the next one)
          LATEST=$(awk '/^## / {n++} n>=2 {exit} n==1 {print}' CHANGELOG.md)

          {
            echo "${LATEST}"
            echo ""
            echo "[View commit](${SERVER_URL}/${REPO}/commit/${SHA})"
          } | gh issue comment "${ISSUE}" --body-file -

      - name: Close user-request issues that shipped this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          STATE="catalog/curator-state.md"
          [ -f "$STATE" ] || exit 0

          # Extract the (closed this run) block.
          BLOCK=$(awk '
            /^## User requests \(closed this run\)/ { capture=1; next }
            /^## / && capture { exit }
            capture
          ' "$STATE")

          if [ -z "$BLOCK" ] || echo "$BLOCK" | grep -q '^_None\._'; then
            echo "No closed user requests this run."
            exit 0
          fi

          SHA=$(git rev-parse HEAD)
          COMMIT_URL="${SERVER_URL}/${REPO}/commit/${SHA}"
          PAGES_BASE="https://scripps-ai-enablement.github.io/sci-ai-enabler"

          # For each line with an issue number, comment and close.
          while IFS= read -r LINE; do
            NUM=$(printf '%s' "$LINE" | grep -oE 'issue=[0-9]+' | head -1 | cut -d= -f2)
            if [ -z "$NUM" ]; then
              # Fallback: try the "[#NN ...]" prefix.
              NUM=$(printf '%s' "$LINE" | grep -oE '\[#[0-9]+' | head -1 | tr -d '[#')
            fi
            [ -z "$NUM" ] && continue
            RESULT=$(printf '%s' "$LINE" | sed -E 's/.*→ //')

            # If the result note names a recipe or tool page, append a direct Pages URL
            # so the user can read the durable answer without clicking through the commit diff.
            PAGE_PATH=$(printf '%s' "$RESULT" | grep -oE '(recipes/items|catalog/tools)/[a-z0-9-]+\.md' | head -1)
            LINK_LINE=""
            if [ -n "$PAGE_PATH" ]; then
              PAGE_URL="${PAGES_BASE}/${PAGE_PATH%.md}.html"
              LINK_LINE=$'\n\nRead the answer here: '"${PAGE_URL}"
            fi

            # An entry claiming `outcome=blocked` must never close the issue — the
            # request is understood but unanswered, and closing it as `completed`
            # tells the user "done" when the truth is "can't yet" (issue #74).
            # Park it in `(blocked)` instead; fulfill.yml and later scheduled runs
            # pick it up from there once the blocker clears.
            if printf '%s' "$LINE" | grep -q 'outcome=blocked'; then
              echo "#${NUM} is blocked; parking it instead of closing."
              python3 scripts/request_state.py move --state "$STATE" --issue "$NUM" --to blocked || true
              gh label create "claude:blocked-on-catalog" --repo "$REPO" --color "D93F0B" \
                --description "Answerable, but waiting on a component to be catalogued" --force || true
              gh issue edit "$NUM" --repo "$REPO" --add-label "claude:blocked-on-catalog" || true
              gh issue comment "$NUM" --repo "$REPO" --body \
              "**Not done yet — and not closing this.** ${RESULT}"$'\n\n'"Recorded in ${COMMIT_URL}. Every scheduled curator pass re-checks blocked requests, so this is picked up again automatically once the blocker clears." || true
              continue
            fi

            if printf '%s' "$LINE" | grep -q 'outcome=declined'; then
              # Terminal, but not a success — don't dress it up as one.
              gh issue comment "$NUM" --repo "$REPO" --body \
              "**Not doing this one — here's why.** ${RESULT}"$'\n\n'"Recorded in ${COMMIT_URL} so the reasoning isn't lost. Closing, but reopen with more detail if you think this was the wrong call." || true
              gh issue close "$NUM" --repo "$REPO" --reason completed || true
              continue
            fi

            gh issue comment "$NUM" --repo "$REPO" --body "Shipped in ${COMMIT_URL}. ${RESULT}${LINK_LINE}"$'\n\nClosing — feel free to reopen if this missed the mark.' || true
            # A previously-parked request is no longer parked once it ships.
            gh issue edit "$NUM" --repo "$REPO" --remove-label "claude:blocked-on-catalog" >/dev/null 2>&1 || true
            gh issue close "$NUM" --repo "$REPO" --reason completed || true
          done <<< "$BLOCK"

          # Reset the (closed this run) section to _None._ and commit.
          python3 - "$STATE" <<'PY'
          import re, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          pattern = re.compile(
              r"(## User requests \(closed this run\)\n\n)(?:.*?)(\n## |\Z)",
              re.DOTALL,
          )
          new_text, n = pattern.subn(lambda m: m.group(1) + "_None._\n" + m.group(2), text, count=1)
          if n == 1 and new_text != text:
              path.write_text(new_text)
              print("reset (closed this run) to _None._")
          PY

          if ! git diff --quiet "$STATE"; then
            git add "$STATE"
            git commit -m "loop-closed: reset closed-this-run section"
            git pull --rebase origin main
            git push
          fi
