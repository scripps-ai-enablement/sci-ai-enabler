# .github/ISSUE_TEMPLATE/recipe-feedback.yml
name: Share feedback on a recipe
description: "I tried recipe X and… — we'll reply in-thread and queue the feedback for the next scheduled run."
title: "[Recipe feedback] "
labels: ["claude:recipe-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your experience. Concrete details (commands you ran, errors, hardware, datasets) make the next curator run much more useful.
  - type: dropdown
    id: recipe
    attributes:
      label: Which recipe?
      description: Auto-synced from the cookbook. Pick "Not listed" if your feedback isn't about one of these.
      options:
        - analyze-md-trajectory-with-mdanalysis
        - annotate-a-bacterial-genome
        - annotate-and-verify-a-plasmid-construct
        - annotate-cell-types-in-single-cell-data
        - assemble-cancer-imaging-cohort-from-idc
        - assemble-reference-atlas-from-cellxgene-census
        - benchmark-admet-property-with-pytdc
        - build-pharmacogenomic-dosing-report
        - build-phylogenetic-tree-from-sequences
        - build-target-dossier
        - call-peaks-and-motifs-from-chipseq-atacseq
        - compute-16s-microbiome-diversity
        - compute-bacterial-pangenome-from-assemblies
        - compute-hrv-from-ecg-recording
        - convert-instrument-data-to-allotrope-asm
        - design-crispr-sgrnas-for-a-gene-knockout
        - detect-somatic-cnvs-from-tumor-sequencing
        - discover-nwb-recordings-on-dandi
        - dock-ligand-library-with-diffdock
        - draft-phase23-clinical-trial-protocol
        - enumerate-analogs-around-a-lead
        - estimate-pk-properties
        - extract-event-related-potentials-from-eeg
        - extract-structured-data-from-clinical-notes
        - filter-virtual-screening-hits
        - find-repurposing-candidates-in-a-knowledge-graph
        - find-selective-cancer-dependencies-with-depmap
        - fit-survival-model-to-clinical-outcomes
        - harmonize-clinical-terms-to-standard-codes
        - identify-bacterial-isolate-from-16s-sequence
        - identify-unknown-compound-from-msms-spectrum
        - infer-cell-cell-communication-from-scrnaseq
        - infer-gene-regulatory-network-from-scrnaseq
        - infer-protein-function-from-structure
        - infer-tf-and-pathway-activities-from-expression
        - integrate-single-cell-datasets
        - interpret-clinical-variant
        - interpret-glycosylation-altering-variants
        - map-disease-to-genes-and-pathways
        - match-patient-to-clinical-trials
        - organize-raw-dicom-to-bids-layout
        - parse-fcs-flow-cytometry-files
        - predict-antibody-antigen-complex
        - predict-gene-knockout-phenotypes-with-fba
        - predict-hospital-readmission-from-ehr
        - predict-noncoding-variant-regulatory-effects
        - predict-protein-protein-complex-interface
        - predict-rna-secondary-structure-and-accessibility
        - prepare-protonation-states-for-docking
        - prioritize-targets-within-a-disease
        - profile-cancer-cohort-genomics-with-cbioportal
        - profile-chipseq-atacseq-signal-around-features
        - profile-compound-polypharmacology
        - qc-single-cell-rna-seq
        - quantify-bulk-rnaseq-fastq-to-counts
        - rank-compound-library-by-predicted-affinity
        - reconstruct-bcr-clonal-lineages
        - register-longitudinal-medical-scans
        - run-bulk-rnaseq-differential-expression
        - run-functional-enrichment-on-a-gene-list
        - run-gwas-on-case-control-genotypes
        - scan-adverse-events-for-drug-safety-signal
        - scan-antibody-glycosylation-sites
        - scan-drug-repurposing-candidates
        - scan-protein-for-cd8-t-cell-epitopes
        - score-drug-combination-synergy
        - score-protein-variants-with-esm
        - screen-genome-for-resistance-and-virulence-genes
        - screen-polypharmacy-for-drug-interactions
        - segment-and-quantify-cells-in-microscopy
        - segment-organ-or-tumor-in-medical-image
        - set-up-protein-md-simulation-in-gromacs
        - sort-spikes-from-neuropixels-recording
        - superpose-two-protein-structures
        - tile-and-normalize-whole-slide-image
        - triage-alphafold-model-for-docking
        - triage-gwas-hits-to-drug-targets
        - triage-new-preprints
        - validate-a-drug-target-with-a-go-no-go-score
        - Not listed
    validations:
      required: true
  - type: dropdown
    id: sentiment
    attributes:
      label: How did it go?
      options:
        - worked great
        - worked but slow
        - got stuck
        - found a better way
        - something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: 40–800 characters. Mention concrete details — commands, errors, dataset size, hardware, wall-clock.
      placeholder: "I ran the recipe on a 12-sample dataset; PyDESeq2 install failed on Mac M1 with X error, fixed by using the conda-forge build."
    validations:
      required: true
