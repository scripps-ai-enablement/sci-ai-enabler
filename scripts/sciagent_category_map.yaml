# SciAgent-Skills (jaechang-hits/SciAgent-Skills) → catalog category map
# =======================================================================
# Auditable scope filter + category tagging for the one-time batch ingestion
# (see scripts/ingest_collection.py + scripts/collections.yaml).
#
# Source repo: 140 skills under skills/<group>/<slug>/SKILL.md across 12 thematic
# groups (2026-06 clone). Repo LICENSE is CC BY 4.0; per-skill `license` fields
# vary (BSD/MIT/Apache/GPL/CC). Install path: clone + `/plugin install
# sciagent-skills` (it ships as a Claude Code plugin); NOT an npm package.
#
# Three dispositions for every skill (every skills/ slug must appear in exactly
# one of include / augment / skip):
#   include : tool NOT yet catalogued from any source -> CREATE a new page.
#   augment : tool ALREADY catalogued (usually from K-Dense) -> the generator
#             appends a sentinel-guarded "also packaged in SciAgent" install
#             bullet to the existing page (one entry per tool). Value is the
#             existing catalog slug to augment.
#   skip    : out of scope -> recorded with a reason, never written.
#
# `tool_categories` values must be exactly one or more of the 7 research areas,
# `All`, or `General-Purpose Utilities` (see AGENT.md).

