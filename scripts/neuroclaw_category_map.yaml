# --- SKIP: out of scope (recorded for the audit trail) -----------------------
skip:
  claw-shell: "NeuroClaw internal harness (safe shell execution for other skills); not a standalone life-science tool."
  harness-core: "NeuroClaw internal harness library (self-verification/checkpointing); not a tool."
  conda-env-manager: "Generic conda environment management; not life-science specific."
  docker-env-manager: "Generic Docker management; not life-science specific."
  dependency-planner: "NeuroClaw internal dependency-resolution helper; not a tool."
  skill-updater: "NeuroClaw internal self-improvement helper; not a tool."
  beautiful-log: "HTML chat-log formatter; internal utility, not a tool."
  experiment-controller: "NeuroClaw internal experiment-runner step; not a standalone tool."
  method-design: "NeuroClaw internal research-workflow step (architecture formalization); not a tool."
  git-essentials: "Generic git command guide; not life-science specific."
  git-workflows: "Generic advanced-git guide; not life-science specific."
  academic-research-hub: "Proprietary license; generic academic search/download — out of scope."
  multi-search-engine: "Generic multi-engine web search; not life-science specific."
  knowledge-graph-builder: "Generic literature/DB knowledge-graph builder; not neuroscience-specific."
  paper-writing: "General manuscript-draft generator; redundant with the scientific-writing entry."
  research-idea: "General research-ideation helper; redundant with scientific-brainstorming."
  overleaf-skill: "Overleaf/LaTeX sync utility; niche, redundant with latex-posters / scientific-writing."

