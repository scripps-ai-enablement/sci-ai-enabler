# NeuroClaw (CUHK-AIM-Group/NeuroClaw) → catalog category map
# ============================================================
# Auditable scope filter + category tagging for the one-time batch ingestion
# (see scripts/ingest_collection.py + scripts/collections.yaml).
#
# Source repo: 86 skills under skills/<slug>/SKILL.md (2026-06 clone). Repo
# LICENSE is MIT; per-skill `license` fields confirm "MIT License (NeuroClaw
# custom skill ...)" for the research skills (a few wrap BSD-3 tools; one is
# proprietary -> skipped). Install path: clone + `python installer/setup.py`
# for the full environment, or copy skills/<slug> into ~/.claude/skills/.
#
# Disposition: every skills/ slug appears in exactly one of include / augment /
# skip. NeuroClaw is a tightly integrated neuroimaging agent system: the
# neuroscience tool wrappers, dataset pipelines, and model docs are in scope;
# the internal harness, generic dev tooling, and general web/writing utilities
# are skipped (recorded with reasons).
#
# `tool_categories` values per AGENT.md. Nearly everything here is Neuroscience.

# --- CREATE: in-scope neuroscience tools, dataset pipelines, model docs -------
