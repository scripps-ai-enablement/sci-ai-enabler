# K-Dense (K-Dense-AI/scientific-agent-skills) → catalog category map
#
# Purpose: the auditable scope filter + category tagging for the one-time batch
# ingestion (see scripts/ingest_kdense.py and the plan at
# .claude/plans/right-now-the-grow-whimsical-emerson.md).
#
# Source repo has 143 skill directories under skills/<name>/SKILL.md as of the
# 2026-06 clone. Of those, the ones below are life-science-relevant per the
# catalog's 7 canonical categories (AGENT.md). Skills NOT in `include` are
# treated as out of scope and skipped (documented under `skip` for the record).
#
# `tool_categories` values must be exactly one or more of the 7 canonical
# categories, or `All`:
#   Chemistry | Immunology and Microbiology |
#   Integrative Structural and Computational Biology |
#   Molecular and Cellular Biology | Neuroscience | Translational Medicine |
#   Drug Repurposing and Discovery | All
#
# The generator reads `include` and `aliases` only. `augment` and `skip` are
# documentation for human reviewers.

include:
  # --- already catalogued as K-Dense pages: generator REPAIRS install path only,
  #     it does NOT rewrite these categories (listed here for the record) ---
  anndata: [Molecular and Cellular Biology]
  arboreto: [Molecular and Cellular Biology]
  bids: [Neuroscience]
  cellxgene-census: [Molecular and Cellular Biology, Immunology and Microbiology, Translational Medicine]
  datamol: [Chemistry, Drug Repurposing and Discovery]
  depmap: [Drug Repurposing and Discovery, Molecular and Cellular Biology, Translational Medicine]
  flowio: [Immunology and Microbiology, Molecular and Cellular Biology]
  gget: [All]
  glycoengineering: [Immunology and Microbiology, Integrative Structural and Computational Biology]
  medchem: [Chemistry, Drug Repurposing and Discovery]
  molecular-dynamics: [Integrative Structural and Computational Biology]
  molfeat: [Chemistry, Drug Repurposing and Discovery]
  neurokit2: [Neuroscience, Translational Medicine]
  neuropixels-analysis: [Neuroscience]
  pydeseq2: [Molecular and Cellular Biology]
  rdkit: [Chemistry, Drug Repurposing and Discovery]   # existing slug: rdkit-skill (see aliases)
  scikit-bio: [Immunology and Microbiology, Molecular and Cellular Biology]
  scvelo: [Molecular and Cellular Biology]

  # --- new pages to CREATE ---
  adaptyv: [Immunology and Microbiology, Integrative Structural and Computational Biology]
  benchling-integration: [Molecular and Cellular Biology, Translational Medicine]
