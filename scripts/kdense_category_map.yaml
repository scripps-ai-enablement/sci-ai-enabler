# K-Dense (K-Dense-AI/scientific-agent-skills) → catalog category map
#
# Purpose: the auditable scope filter + category tagging for the one-time batch
# ingestion (see scripts/ingest_kdense.py and the plan at
# .claude/plans/right-now-the-grow-whimsical-emerson.md).
#
# Source repo has 143 skill directories under skills/<name>/SKILL.md as of the
# 2026-06 clone. Skills NOT in `include` are treated as out of scope and skipped
# (documented under `skip` for the record).
#
# `tool_categories` values must be exactly one or more of the 7 life-science
# research-area categories, the cross-cutting `All` tag, or `General-Purpose
# Utilities` (the domain-agnostic utilities shelf — see AGENT.md):
#   Chemistry | Immunology and Microbiology |
#   Integrative Structural and Computational Biology |
#   Molecular and Cellular Biology | Neuroscience | Translational Medicine |
#   Drug Repurposing and Discovery | All | General-Purpose Utilities
#
# The generator reads `include` and `aliases` only. `augment` and `skip` are
# documentation for human reviewers.

include:
