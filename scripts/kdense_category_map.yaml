# K-Dense skill dir → existing catalog slug, when they differ.
aliases:
  rdkit: rdkit-skill

# Existing NON-K-Dense pages that wrap the SAME underlying tool. Per AGENT.md
# "one entry per tool", do not create a duplicate; instead add the K-Dense skill
# as an alternative install path on the existing page (handled manually).
augment:
  scanpy: scanpy                 # existing page is the scmcphub MCP server
  scvi-tools: scvi-tools         # existing page is the Anthropic scvi-tools skill
  nextflow: nextflow-development # existing page is the Anthropic nextflow skill

# Out of scope for this catalog (general-purpose, not life-science-specific).
# Documented so future runs don't re-evaluate them from scratch.
